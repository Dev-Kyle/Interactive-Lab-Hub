<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Guessing Game</title> <!-- CHANGED -->
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Socket.IO client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* gray-900 */
            color: #f3f4f6; /* gray-100 */
            overflow: hidden;
        }
        .screen {
            display: none; /* Hidden by default */
            min-height: 80vh;
        }
        .screen.active {
            display: flex; /* Shown when active */
        }
        /* CHANGED */
        .student-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 1rem;
            font-size: 3rem; /* Student size */
            line-height: 1;
            user-select: none;
            padding: 1rem;
        }
        .player-tag {
            background-color: #374151; /* gray-700 */
            color: #d1d5db; /* gray-300 */
            padding: 0.5rem 1rem;
            border-radius: 9999px; /* full */
            font-family: monospace;
            font-size: 0.875rem;
            transition: all 0.2s ease-in-out; /* Added transition */
        }
        .guess-item {
            transition: all 0.3s ease;
            transform: scale(1);
        }
        .guess-item.winner {
            background-color: #10b981; /* emerald-500 */
            color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3), 0 4px 6px -2px rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="w-full p-4 bg-gray-800 shadow-md">
        <h1 class="text-2xl font-bold text-center text-white">Distributed Guessing Game</h1>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-6xl mx-auto">
            
            <!-- IDLE Screen -->
            <div id="idle-screen" class="screen active flex-col items-center justify-center text-center">
                <h2 class="text-4xl font-bold mb-6">Waiting for game to start...</h2>
                <button id="start-button" class="px-8 py-4 bg-blue-600 text-white font-bold rounded-lg shadow-lg hover:bg-blue-700 transition duration-300 text-2xl">
                    Start New Game
                </button>
                <p class="mt-6 text-gray-400 text-lg">Connected Players: <span id="idle-player-count">0</span></p>
            </div>

            <!-- GAME Screen -->
            <div id="game-screen" class="screen flex-col items-center justify-center">
                <h2 class="text-6xl font-extrabold mb-8">
                    How many students? <!-- CHANGED -->
                </h2>
                <div id="countdown-timer" class="text-9xl font-mono font-bold text-yellow-400 mb-8">10</div>
                <!-- CHANGED id and class -->
                <div id="student-container" class="w-full h-96 max-h-[50vh] bg-gray-800 rounded-lg shadow-inner overflow-y-auto student-grid">
                    <!-- Students will be injected here -->
                </div>
            </div>

            <!-- RESULTS Screen -->
            <div id="results-screen" class="screen flex-col items-center justify-center text-center">
                <h2 class="text-5xl font-bold mb-4">Time's Up!</h2>
                <p class="text-3xl mb-8 text-gray-300">The correct answer was:</p>
                <div id="correct-answer" class="text-9xl font-bold text-green-400 mb-10">...</div>
                
                <h3 class="text-2xl font-semibold mb-4">All Guesses:</h3>
                <div id="guesses-list" class="w-full max-w-4xl flex flex-wrap justify-center gap-4">
                    <!-- Guesses will be injected here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Footer / Player List -->
    <footer class="w-full p-4 bg-gray-900 border-t border-gray-700">
        <h3 class="text-lg font-semibold text-center mb-3">Connected Players (<span id="player-count">0</span>)</h3>
        <div id="player-list" class="flex flex-wrap justify-center gap-2">
            <!-- Player tags will be injected here -->
        </div>
    </footer>

    <script>
        // --- State ---
        const socket = io();
        let countdownInterval = null;
        let players = new Set();

        // --- DOM Elements ---
        const screens = {
            idle: document.getElementById('idle-screen'),
            game: document.getElementById('game-screen'),
            results: document.getElementById('results-screen')
        };
        const studentContainer = document.getElementById('student-container'); // CHANGED
        const countdownTimer = document.getElementById('countdown-timer');
        const correctAnsEl = document.getElementById('correct-answer');
        const guessesList = document.getElementById('guesses-list');
        const playerList = document.getElementById('player-list');
        const playerCountEls = [
            document.getElementById('player-count'),
            document.getElementById('idle-player-count')
        ];
        const startButton = document.getElementById('start-button');

        // --- Utility Functions ---
        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.remove('active'));
            if (screens[screenName]) {
                screens[screenName].classList.add('active');
            }
        }

        function updatePlayerList() {
            playerList.innerHTML = ''; // Clear list
            players.forEach(mac => {
                const tag = document.createElement('div');
                tag.className = 'player-tag';
                tag.textContent = mac; // Default text is just MAC
                tag.id = `player-tag-${mac.replace(/:/g, '-')}`;
                playerList.appendChild(tag);
            });
            playerCountEls.forEach(el => el.textContent = players.size);
        }

        function startCountdown(duration) {
            if (countdownInterval) clearInterval(countdownInterval);
            let timer = duration;
            countdownTimer.textContent = timer;
            countdownInterval = setInterval(() => {
                timer--;
                countdownTimer.textContent = timer;
                if (timer <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        // --- SocketIO Event Handlers ---
        socket.on('connect', () => {
            console.log('Connected to server!');
        });

        socket.on('current_players', (data) => {
            players = new Set(data.players);
            updatePlayerList();
        });

        socket.on('player_joined', (data) => {
            console.log('Player joined:', data.mac);
            players.add(data.mac);
            updatePlayerList();
        });

        socket.on('player_left', (data) => {
            console.log('Player left:', data.mac);
            players.delete(data.mac);
            updatePlayerList();
        });
        
        // --- NEW: Handle live guess updates ---
        socket.on('live_guess', (data) => {
            console.log('Live guess:', data);
            const tag = document.getElementById(`player-tag-${data.mac.replace(/:/g, '-')}`);
            if (tag) {
                // Update player tag to show their guess
                tag.textContent = `${data.mac} (${data.guess})`;
                tag.style.backgroundColor = '#059669'; // emerald-700
            }
        });
        
        socket.on('game_state', (data) => {
            console.log('Syncing game state:', data.state);
            if(data.state === 'IDLE') {
                showScreen('idle');
            } else if (data.state === 'GUESSING') {
                // Can't fully sync a game in progress, just show it's happening
                showScreen('game');
                countdownTimer.textContent = '...';
                studentContainer.innerHTML = '<h2>Game in progress...</h2>'; // CHANGED
            } else if (data.state === 'RESULTS') {
                showScreen('results');
                correctAnsEl.textContent = data.answer;
            }
        });

        socket.on('new_round', (data) => {
            console.log('New round started!', data);
            showScreen('game');
            
            // --- Reset player tags ---
            updatePlayerList();

            // Populate students // CHANGED
            studentContainer.innerHTML = '';
            for (let i = 0; i < data.student_count; i++) { // student_count is still the var name from the server
                const student = document.createElement('span');
                student.textContent = '🧑‍🎓'; // CHANGED
                studentContainer.appendChild(student); // CHANGED
            }
            
            // Start countdown
            startCountdown(data.countdown);
            
            // Clear old results
            guessesList.innerHTML = '';
        });

        socket.on('show_results', (data) => {
            console.log('Showing results:', data);
            showScreen('results');
            correctAnsEl.textContent = data.correct_answer;
            guessesList.innerHTML = ''; // Clear old guesses
            
            data.guesses.forEach(item => {
                const guessEl = document.createElement('div');
                guessEl.className = 'guess-item w-full md:w-1/2 lg:w-1/3 p-4 bg-gray-800 rounded-lg shadow-md flex justify-between items-center';
                
                const macEl = document.createElement('span');
                macEl.className = 'font-mono text-gray-400 text-sm';
                macEl.textContent = item.mac;
                
                const valEl = document.createElement('span');
                valEl.className = 'font-bold text-2xl';
                valEl.textContent = item.guess === null ? 'No Guess' : item.guess;
                
                guessEl.appendChild(macEl);
                guessEl.appendChild(valEl);
                
                if (data.winners.includes(item.mac)) {
                    guessEl.classList.add('winner');
                }
                
                guessesList.appendChild(guessEl);
            });
        });

        socket.on('round_idle', () => {
            console.log('Returning to idle screen.');
            showScreen('idle');
        });

        // --- UI Event Listeners ---
        startButton.addEventListener('click', () => {
            console.log('Requesting new game...');
            socket.emit('start_game');
            startButton.disabled = true;
            startButton.textContent = 'Starting...';
            
            // Re-enable button after a moment
            setTimeout(() => {
                startButton.disabled = false;
                startButton.textContent = 'Start New Game';
            }, 2000);
        });

        // --- Initial Load ---
        showScreen('idle'); // Start on the idle screen

    </script>
</body>
</html>
